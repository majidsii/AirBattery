[package]
name = "airbattery-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lib]
name = "airbattery_desktop"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "airbattery"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
airbattery-core = { path = "../../../crates/airbattery-core", version = "=0.1.0-alpha.1" }
airbattery-service = { path = "../../../crates/airbattery-service", version = "=0.1.0-alpha.1" }
airbattery-settings = { path = "../../../crates/airbattery-settings", version = "=0.1.0-alpha.1" }
diagnostics = { path = "../../../crates/diagnostics", version = "=0.1.0-alpha.1" }
device-protocols = { path = "../../../crates/device-protocols", version = "=0.1.0-alpha.1" }
protocol-airpods = { path = "../../../crates/protocol-airpods", version = "=0.1.0-alpha.1" }
protocol-generic-battery = { path = "../../../crates/protocol-generic-battery", version = "=0.1.0-alpha.1" }
shared-models = { path = "../../../crates/shared-models", version = "=0.1.0-alpha.1" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-window-state = "=2.4.1"

[target.'cfg(target_os = "linux")'.dependencies]
airbattery-dbus = { path = "../../../crates/airbattery-dbus", version = "=0.1.0-alpha.1" }
bluetooth-linux = { path = "../../../crates/bluetooth-linux", version = "=0.1.0-alpha.1" }

[target.'cfg(target_os = "windows")'.dependencies]
bluetooth-windows = { path = "../../../crates/bluetooth-windows", version = "=0.1.0-alpha.1" }
