[workspace]
resolver = "2"
members = [
  "crates/shared-models",
  "crates/device-protocols",
  "crates/protocol-airpods",
  "crates/protocol-generic-battery",
  "crates/airbattery-core",
  "crates/airbattery-service",
  "crates/airbattery-dbus",
  "crates/airbattery-settings",
  "crates/bluetooth-linux",
  "crates/bluetooth-windows",
  "crates/diagnostics",
  "crates/airbattery-cli",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/majidsii/AirBattery"
authors = ["AirBattery contributors"]

[workspace.dependencies]
async-trait = "0.1"
bluer = { version = "0.17", features = ["bluetoothd", "l2cap"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "=0.3.54", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zbus = { version = "=5.18.0", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
