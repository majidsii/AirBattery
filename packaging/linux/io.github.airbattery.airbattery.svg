<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AirBattery application icon</title>
  <desc id="desc">A vertical battery outline with a Bluetooth symbol inside, rendered on a dark liquid-glass tile.</desc>
  <defs>
    <linearGradient id="tile" x1="72" y1="52" x2="442" y2="466" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26374d"/>
      <stop offset="0.44" stop-color="#101a29"/>
      <stop offset="1" stop-color="#070d16"/>
    </linearGradient>
    <linearGradient id="glass" x1="98" y1="70" x2="378" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#9fd4ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bluetooth" x1="215" y1="184" x2="310" y2="331" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dff4ff"/>
      <stop offset="0.48" stop-color="#64b7ff"/>
      <stop offset="1" stop-color="#2f7cff"/>
    </linearGradient>
    <filter id="tileShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000814" flood-opacity="0.62"/>
    </filter>
    <filter id="whiteGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blueGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="34" y="34" width="444" height="444" rx="112" fill="url(#tile)" filter="url(#tileShadow)"/>
  <rect x="42" y="42" width="428" height="428" rx="104" fill="none" stroke="#d9efff" stroke-opacity="0.23" stroke-width="3"/>
  <path d="M78 124C131 61 260 42 374 78c45 14 76 38 96 70V68c0-14-11-26-26-26H68c-14 0-26 12-26 26v150c9-35 20-66 36-94Z" fill="url(#glass)" opacity="0.86"/>
  <ellipse cx="256" cy="446" rx="116" ry="18" fill="#4a9cff" opacity="0.13"/>

  <g fill="none" stroke="#f7fbff" stroke-linejoin="round" filter="url(#whiteGlow)">
    <rect x="154" y="147" width="204" height="270" rx="52" stroke-width="18"/>
    <path d="M216 147v-22c0-16 12-28 28-28h24c16 0 28 12 28 28v22" stroke-width="18" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="url(#bluetooth)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#blueGlow)">
    <path d="M252 190v132l58-48-58-42 58-48-58-44Z"/>
    <path d="m252 232-49-40"/>
    <path d="m252 274-49 40"/>
  </g>
</svg>
