<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AirBattery application icon</title>
  <desc id="desc">A slim white vertical battery with a centered Bluetooth mark on a dark liquid-glass tile.</desc>
  <defs>
    <linearGradient id="glass" x1="78" y1="56" x2="432" y2="458" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#344a61"/>
      <stop offset="0.38" stop-color="#1b2b3d"/>
      <stop offset="1" stop-color="#09131f"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(154 102) rotate(42) scale(350 302)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b8d9f4" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#6d9bc4" stop-opacity=".07"/>
      <stop offset="1" stop-color="#0a111a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="70" y1="55" x2="435" y2="462" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".48"/>
      <stop offset=".42" stop-color="#dceeff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#8db2d3" stop-opacity=".07"/>
    </linearGradient>
    <linearGradient id="topSheen" x1="92" y1="65" x2="365" y2="184" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset=".58" stop-color="#ffffff" stop-opacity=".045"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="36" y="36" width="440" height="440" rx="108"/>
    </clipPath>
    <filter id="tileShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000814" flood-opacity=".46"/>
    </filter>
    <filter id="markGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation=".9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#glass)" filter="url(#tileShadow)"/>
  <g clip-path="url(#tileClip)">
    <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#ambient)"/>
    <path d="M72 145c54-58 145-91 244-85 69 4 119 24 157 60V71c0-17-13-30-30-30H71c-17 0-30 13-30 30v132c8-20 18-40 31-58Z" fill="url(#topSheen)"/>
  </g>
  <rect x="41" y="41" width="430" height="430" rx="103" fill="none" stroke="url(#edge)" stroke-width="3"/>

  <!-- Approved base mark: short solid terminal, slim body, smaller centered Bluetooth symbol. -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" filter="url(#markGlow)">
    <rect x="205" y="170" width="102" height="205" rx="27" stroke-width="15"/>
    <path d="M256 224v88m0-88 26 23-26 23 26 22-26 20m0-42-24-21m24 21-24 21" stroke-width="11"/>
  </g>
  <rect x="241" y="145" width="30" height="25" rx="6" fill="#ffffff" filter="url(#markGlow)"/>
</svg>
