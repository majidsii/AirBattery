name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  source:
    name: Source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python validation dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 Pillow==12.3.0

      - name: Validate automation and release sources
        run: |
          python3 scripts/verify-ci-source.py
          python3 scripts/verify-release-source.py
          python3 scripts/verify-version-sync.py

      - name: Run dependency-free source checks
        run: |
          python3 scripts/verify_reference_models.py
          python3 scripts/verify-desktop-source.py
          python3 scripts/verify-tauri-source.py
          python3 scripts/verify-dbus-source.py
          python3 scripts/verify-gnome-source.py
          python3 scripts/verify-packaging-source.py

      - name: Run Python tests
        run: python3 -m unittest tests/release_artifacts_test.py tests/ubuntu_validation_script_test.py

      - name: Run desktop contract tests
        run: npm --prefix apps/desktop test

      - name: Run GNOME extension tests
        run: npm --prefix apps/gnome-extension test

      - name: Check JavaScript and shell syntax
        run: |
          node --check apps/gnome-extension/extension.js
          node --check apps/gnome-extension/prefs.js
          node --check apps/gnome-extension/refresh-controller.js
          node --check apps/gnome-extension/service.js
          node --check apps/gnome-extension/snapshot.js
          bash -n scripts/install-gnome-extension.sh
          bash -n scripts/package-gnome-extension.sh

  frontend:
    name: Desktop frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run contract tests
        run: npm run test

      - name: Build frontend
        run: npm run build

  rust-linux:
    name: Rust on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Cache Cargo data
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-rust-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.1-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm --prefix apps/desktop ci

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Build release workspace
        run: cargo build --workspace --release

  rust-windows:
    name: Rust on Windows
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo data
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-rust-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.1-

      - name: Test Windows-capable crates
        run: cargo test -p bluetooth-windows -p shared-models -p device-protocols -p protocol-airpods -p protocol-generic-battery -p airbattery-service -p diagnostics

      - name: Check the Windows desktop target
        run: cargo check -p airbattery-desktop --target x86_64-pc-windows-msvc

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache Cargo data
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-audit-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-audit-1.97.1-

      - name: Run cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          command: check
          arguments: --all-features

      - name: Audit npm lockfile
        working-directory: apps/desktop
        run: npm audit --audit-level=high
