version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 0
    groups:
      rust-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps-rust)"

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 0
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps-web)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps-actions)"
